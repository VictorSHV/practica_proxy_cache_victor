services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
    networks:
      - backend_net

  api:
    build: ./api
    container_name: api-service
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - backend_net

  redis:
    image: redis:alpine
    container_name: redis-server
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  nginx_cache:
