version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis-server
    networks:
      - backend_net

  api:
    build: ./api
    container_name: api-service
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - backend_net

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "8080:80"
    volumes:
      # Mapeamos la carpeta que ya tienes al lugar donde Nginx busca la config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge

volumes:
  nginx_cache:
